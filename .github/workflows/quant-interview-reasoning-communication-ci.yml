name: Quant Interview Reasoning & Communication 013 CI

on:
  push:
    branches: [chatgpt/quant-interview-integration-reasoning-communication-2026-08-24]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-013:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run Astro checks
        run: npm run check
      - name: Build site
        run: npm run build
