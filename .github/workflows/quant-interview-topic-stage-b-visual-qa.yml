name: Quant Interview Topic Stage B Visual QA

on:
  push:
    branches:
      - chatgpt/quant-interview-topic-first-stage-b-2026-08-16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/quant-interview-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/knowledge/quant-interview/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/quant-interview-preview.log
          exit 1
      - name: Capture screenshots
        run: |
          mkdir -p visual-qa
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" --full-page http://127.0.0.1:4321/knowledge/quant-interview/ visual-qa/hub-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page http://127.0.0.1:4321/knowledge/quant-interview/ visual-qa/hub-mobile.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" --full-page http://127.0.0.1:4321/problems/ visual-qa/problems-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page http://127.0.0.1:4321/problems/ visual-qa/problems-mobile.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: quant-interview-stage-b-visual-qa
          path: visual-qa/*.png
