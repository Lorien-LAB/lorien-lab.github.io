name: Reproduction Research Note V3 CI

on:
  push:
    branches: [reproduction-research-note-v3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Verify V3 output
        run: |
          test -f dist/projects/reproductions/stock-index-futures-roll-basis-timing/index.html
          grep -q 'Annualized Return' dist/projects/reproductions/stock-index-futures-roll-basis-timing/index.html
          grep -q 'OUT OF SAMPLE' dist/projects/reproductions/stock-index-futures-roll-basis-timing/index.html
