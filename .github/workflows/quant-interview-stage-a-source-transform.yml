name: Quant Interview Stage A Internal Generator

on:
  push:
    branches:
      - chatgpt/quant-interview-topic-first-stage-a-2026-08-16

permissions:
  contents: write

jobs:
  generate:
    if: contains(github.event.head_commit.message, 'trigger root readme')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/tmp-stage-a-source-transform.mjs
      - name: Commit root repository memory
        run: |
          git config user.name "Lorien"
          git config user.email "2249297094@qq.com"
          git add README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: align root README with topic-first interview architecture"
          git push
