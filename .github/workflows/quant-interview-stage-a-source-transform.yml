name: Quant Interview Stage A Internal Generator

on:
  push:
    branches:
      - chatgpt/quant-interview-topic-first-stage-a-2026-08-16

permissions:
  contents: write

jobs:
  generate:
    if: contains(github.event.head_commit.message, 'trigger topic map')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/tmp-stage-a-topic-map.mjs
      - name: Commit generated internal routing
        run: |
          git config user.name "Lorien"
          git config user.email "2249297094@qq.com"
          git add src/data/quant-interview/toc/green-book.json src/data/quant-interview/topics/source-topic-map.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: map interview source TOCs into canonical topics"
          git push
