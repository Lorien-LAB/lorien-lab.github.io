name: Quant Interview Merged Result Verification
on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-expectation-variance-covariance-2026-08-19
    paths:
      - .github/workflows/quant-interview-merged-result-verification.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Verify exact merged durable commit
        env:
          MERGED_SHA: 942ee256a36fe148dea598d06f56906e18d8ae51
          TARGET_BRANCH: chatgpt/quant-interview-workstream-expectation-variance-covariance-2026-08-19
        run: |
          set -euo pipefail
          git worktree add /tmp/quant-interview-merged-verify "$MERGED_SHA"
          cd /tmp/quant-interview-merged-verify
          npm ci
          npm run test
          npm run check
          npm run build
          cd "$GITHUB_WORKSPACE"
          cat > .github/quant-interview-merged-result-evidence.json <<EOF
          {
            "verifiedCommit": "$MERGED_SHA",
            "triggerSha": "$GITHUB_SHA",
            "runId": $GITHUB_RUN_ID,
            "commands": ["npm run test", "npm run check", "npm run build"],
            "conclusion": "success"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/quant-interview-merged-result-evidence.json
          git commit -m "ci: record merged expectation verification $GITHUB_RUN_ID"
          git push origin HEAD:"$TARGET_BRANCH"
