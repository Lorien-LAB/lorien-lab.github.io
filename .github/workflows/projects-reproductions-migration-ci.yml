name: Projects Reproductions Migration CI

on:
  push:
    branches: [projects-reproductions-url-migration-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Smoke tests
        run: npm test
      - name: Astro check
        run: npm run check
      - name: Astro build
        run: npm run build
      - name: Verify built routes and redirects
        run: |
          test -f dist/projects/reproductions/index.html
          test -f dist/knowledge/reproductions/index.html
          grep -qi 'http-equiv="refresh"' dist/knowledge/reproductions/index.html
