name: Quant Interview Vectors Post Merge Verify

on:
  push:
    branches:
      - chatgpt/quant-interview-topic-first-fusion-design-2026-08-16
    paths:
      - .github/workflows/quant-interview-vectors-post-merge-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run check
      - run: npm run build
