name: Reproduction Case Study V2 CI

on:
  push:
    branches: [reproduction-case-study-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Smoke tests
        run: npm test
      - name: Astro check
        run: npm run check
      - name: Astro build
        run: npm run build
      - name: Verify case-study output
        run: |
          test -f dist/projects/reproductions/stock-index-futures-roll-basis-timing/index.html
          grep -q '股指期货滚贴水择时与市场情绪因子' dist/projects/reproductions/stock-index-futures-roll-basis-timing/index.html
          grep -q 'Beyond Reproduction' dist/projects/reproductions/stock-index-futures-roll-basis-timing/index.html
