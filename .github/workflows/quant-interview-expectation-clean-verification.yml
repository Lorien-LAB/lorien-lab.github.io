name: Quant Interview Expectation Clean Verification
on:
  push:
    branches:
      - chatgpt/quant-interview-expectation-variance-covariance-clean-verification-2026-08-22
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 8b52b8f4a4f9ab305e52dc2eeae45f3a193f9fc2
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify exact clean feature commit
        shell: bash
        run: |
          set +e
          npm run test > /tmp/clean-test.log 2>&1
          TEST_STATUS=$?
          npm run check > /tmp/clean-check.log 2>&1
          CHECK_STATUS=$?
          npm run build > /tmp/clean-build.log 2>&1
          BUILD_STATUS=$?
          set -e

          if [ "$TEST_STATUS" -eq 0 ] && [ "$CHECK_STATUS" -eq 0 ] && [ "$BUILD_STATUS" -eq 0 ]; then
            CONCLUSION=success
          else
            CONCLUSION=failure
          fi

          git fetch origin chatgpt/quant-interview-expectation-variance-covariance-clean-verification-2026-08-22
          git switch -C chatgpt/quant-interview-expectation-variance-covariance-clean-verification-2026-08-22 origin/chatgpt/quant-interview-expectation-variance-covariance-clean-verification-2026-08-22

          export TARGET_COMMIT=8b52b8f4a4f9ab305e52dc2eeae45f3a193f9fc2
          export RUN_ID='${{ github.run_id }}'
          export CONCLUSION TEST_STATUS CHECK_STATUS BUILD_STATUS
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const tail = (file) => readFileSync(file, 'utf8').split('\n').slice(-120).join('\n');
          const evidence = {
            targetCommit: process.env.TARGET_COMMIT,
            runId: Number(process.env.RUN_ID),
            conclusion: process.env.CONCLUSION,
            commands: ['npm run test', 'npm run check', 'npm run build'],
            statuses: {
              test: Number(process.env.TEST_STATUS),
              check: Number(process.env.CHECK_STATUS),
              build: Number(process.env.BUILD_STATUS),
            },
            logTails: {
              test: tail('/tmp/clean-test.log'),
              check: tail('/tmp/clean-check.log'),
              build: tail('/tmp/clean-build.log'),
            },
          };
          writeFileSync('.github/quant-interview-expectation-clean-verification.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/quant-interview-expectation-clean-verification.json
          git commit -m "ci: record clean expectation verification ${{ github.run_id }}"
          git push origin HEAD:chatgpt/quant-interview-expectation-variance-covariance-clean-verification-2026-08-22

          if [ "$CONCLUSION" != success ]; then
            exit 1
          fi

# manual rerun marker: 2026-08-22 finishing verification
