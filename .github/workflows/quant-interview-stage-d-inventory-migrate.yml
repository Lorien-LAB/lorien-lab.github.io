name: Quant Interview Stage D Inventory Migration

on:
  push:
    branches:
      - chatgpt/quant-interview-topic-first-stage-d-covariance-psd-2026-08-16

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, 'run Stage D inventory migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Upsert inspected item inventory
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const specs = {
            'green-book': [
              ['3.6.4','psd-pd-criteria',['linear-algebra-matrix-methods','positive-semidefinite-matrices']],
              ['3.6.4','correlation-range-0.8-0.8',['linear-algebra-matrix-methods','covariance-correlation-matrices','positive-semidefinite-matrices']],
              ['4.5','covariance-correlation-definitions',['linear-algebra-matrix-methods','covariance-correlation-matrices']],
            ],
            'red-book': [
              ['3.2.1','3.26',['linear-algebra-matrix-methods','covariance-correlation-matrices','positive-semidefinite-matrices']],
              ['3.2.1','3.35',['linear-algebra-matrix-methods','covariance-correlation-matrices','positive-semidefinite-matrices']],
              ['6.2.1','6.9',['linear-algebra-matrix-methods','positive-semidefinite-matrices']],
            ],
            '150-most-frequently-asked': [
              ['2.2','1',['linear-algebra-matrix-methods','covariance-correlation-matrices','positive-semidefinite-matrices']],
              ['2.2','2',['linear-algebra-matrix-methods','covariance-correlation-matrices']],
              ['2.2','3',['linear-algebra-matrix-methods','covariance-correlation-matrices','positive-semidefinite-matrices']],
              ['2.2','10',['linear-algebra-matrix-methods','covariance-correlation-matrices','positive-semidefinite-matrices']],
            ],
          };
          for (const [source, rows] of Object.entries(specs)) {
            const path = `src/data/quant-interview/coverage/${source}.json`;
            const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
            const keys = new Set(ledger.entries.map(e => `${e.sourceSection}::${e.sourceItem ?? ''}`));
            for (const [sourceSection, sourceItem, canonicalTopics] of rows) {
              const key = `${sourceSection}::${sourceItem}`;
              if (keys.has(key)) throw new Error(`inventory row already exists unexpectedly: ${source} ${key}`);
              ledger.entries.push({
                sourceSection,
                sourceItem,
                canonicalTopics,
                state: 'needs-review',
                canonicalProblems: [],
                canonicalKnowledge: [],
                topicOverrideReason: 'Item-level review classifies this specific covariance/correlation/PSD item more precisely than the broader editorial TOC section when necessary.'
              });
              keys.add(key);
            }
            fs.writeFileSync(path, JSON.stringify(ledger, null, 2) + '\n');
          }
          NODE
      - name: Commit inventory
        run: |
          git config user.name Lorien
          git config user.email 2249297094@qq.com
          git add src/data/quant-interview/coverage
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "data: inventory first cross-book covariance PSD workstream [skip ci]"
          git push
