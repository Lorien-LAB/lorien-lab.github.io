name: Quant Interview Random Variables Distributions Cleanup

on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-random-variables-distributions-2026-08-18
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove temporary RVD verification tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .ci
          git rm .github/workflows/quant-interview-random-variables-distributions-ci.yml
          git commit -m "chore: remove random variables distributions workstream tooling"
          git push
