name: Quant Interview Random Variables Distributions CI

on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-random-variables-distributions-2026-08-18
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run check
      - run: npm run build
      - name: Record baseline success
        run: |
          mkdir -p .ci
          printf '%s\n' "$GITHUB_SHA" > .ci/quant-interview-rvd-baseline-success.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/quant-interview-rvd-baseline-success.txt
          git commit -m "chore: record RVD baseline CI success"
          git push
