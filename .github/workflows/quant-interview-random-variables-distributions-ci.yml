name: Quant Interview Random Variables Distributions CI

on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-random-variables-distributions-2026-08-18
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-red-coverage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify coverage RED
        run: |
          set +e
          npm run test > /tmp/rvd-red.log 2>&1
          status=$?
          set -e
          cat /tmp/rvd-red.log
          test "$status" -ne 0
          grep -q "green-book missing coverage row 4.4::definitions-discrete-continuous-distributions" /tmp/rvd-red.log
          grep -q "red-book missing coverage row 3.2.1::3.31" /tmp/rvd-red.log
          grep -q "150-most-frequently-asked missing coverage row 2.6::1" /tmp/rvd-red.log
      - name: Record expected RED
        run: |
          mkdir -p .ci
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'expected_failure=missing-fourteen-coverage-rows\n'
          } > .ci/rvd-red-coverage.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/rvd-red-coverage.txt
          git commit -m "chore: record RVD coverage RED"
          git push
