name: Quant Interview Random Variables Distributions Coverage Mutator

on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-random-variables-distributions-2026-08-18
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-coverage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/quant-interview-upsert-rvd-coverage.mjs
      - run: npm run test
      - run: npm run check
      - run: npm run build
      - name: Commit validated coverage ledgers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/quant-interview/coverage/green-book.json \
                  src/data/quant-interview/coverage/red-book.json \
                  src/data/quant-interview/coverage/150-most-frequently-asked.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: reconcile random variables distributions coverage"
          git push
