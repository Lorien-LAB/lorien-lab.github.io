name: Quant Interview Final Verification
on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-expectation-variance-covariance-2026-08-19
    paths:
      - .github/workflows/quant-interview-final-verification.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Verify exact durable Quant Interview tree
        env:
          DURABLE_SHA: 8b52b8f4a4f9ab305e52dc2eeae45f3a193f9fc2
          TARGET_BRANCH: chatgpt/quant-interview-workstream-expectation-variance-covariance-2026-08-19
        run: |
          set -euo pipefail
          git worktree add /tmp/quant-interview-final-verify "$DURABLE_SHA"
          cd /tmp/quant-interview-final-verify
          npm ci
          npm run test
          npm run check
          npm run build
          cd "$GITHUB_WORKSPACE"
          cat > .github/quant-interview-final-verification-evidence.json <<EOF
          {
            "verifiedCommit": "$DURABLE_SHA",
            "triggerSha": "$GITHUB_SHA",
            "runId": $GITHUB_RUN_ID,
            "commands": ["npm run test", "npm run check", "npm run build"],
            "conclusion": "success"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/quant-interview-final-verification-evidence.json
          git commit -m "ci: record final expectation verification $GITHUB_RUN_ID"
          git push origin HEAD:"$TARGET_BRANCH"
