name: Quant Interview Stage C Post-Merge Verify

on:
  push:
    branches:
      - chatgpt/quant-interview-topic-first-fusion-design-2026-08-16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
      - name: Run Astro checks
        run: npm run check
      - name: Build site
        run: npm run build
