name: Quant Interview Vectors Semantic Migration

on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-vectors-linear-systems-2026-08-17
    paths:
      - .github/workflows/quant-interview-vectors-semantic-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Resolve semantic identities
        run: |
          node <<'NODE'
          const fs = require('fs');
          const greenPath = 'src/data/quant-interview/coverage/green-book.json';
          const q150Path = 'src/data/quant-interview/coverage/150-most-frequently-asked.json';
          const green = JSON.parse(fs.readFileSync(greenPath, 'utf8'));
          const q150 = JSON.parse(fs.readFileSync(q150Path, 'utf8'));
          const byKey = (ledger) => new Map(ledger.entries.map((e) => [`${e.sourceSection}::${e.sourceItem ?? ''}`, e]));
          const g = byKey(green);
          const q = byKey(q150);

          const knowledgeOnly = {
            '3.6.1::vector-coordinate-representation': 'Canonical vector geometry Knowledge absorbs the source coordinate interpretation as a reusable definition.',
            '3.6.1::dot-product': 'Canonical vector geometry Knowledge absorbs the source dot-product definition and its interview-useful consequences.',
            '3.6.1::euclidean-norm-distance': 'Canonical vector geometry Knowledge absorbs Euclidean norm and distance as reusable geometry.',
            '3.6.1::angle-orthogonality': 'Canonical vector geometry Knowledge absorbs angle and orthogonality as reusable inner-product geometry.',
          };
          for (const [key, note] of Object.entries(knowledgeOnly)) {
            const e = g.get(key); if (!e) throw new Error(`Missing ${key}`);
            e.state = 'knowledge-only';
            e.canonicalProblems = [];
            e.canonicalKnowledge = ['vector-geometry-inner-products'];
            e.resolutionNote = note;
          }

          const cosine = g.get('3.6.1::correlation-as-cosine');
          if (!cosine) throw new Error('Missing correlation-as-cosine');
          cosine.state = 'knowledge-only';
          cosine.canonicalProblems = [];
          cosine.canonicalKnowledge = ['vector-geometry-inner-products', 'correlation-matrix'];
          cosine.resolutionNote = 'The source correlation-as-cosine bridge enriches canonical vector geometry while linking to the existing correlation-matrix Knowledge rather than duplicating correlation theory.';

          const range = g.get('3.6.1::correlation-range-0.8-0.8');
          if (!range) throw new Error('Missing correlation range variant');
          range.state = 'variant';
          range.canonicalProblems = ['correlation-matrix-parameter-range'];
          range.canonicalKnowledge = [...new Set([...range.canonicalKnowledge, 'vector-geometry-inner-products'])];
          range.resolutionNote = 'Same canonical three-variable correlation-feasibility problem; this source variant contributes a geometric angle/Gram-vector derivation of the 0.28-to-1 interval rather than a new public Problem.';

          const stochastic = q.get('2.2::9');
          if (!stochastic) throw new Error('Missing 150 2.2::9');
          stochastic.state = 'canonical-problem';
          stochastic.canonicalProblems = ['product-of-row-stochastic-matrices'];
          stochastic.canonicalKnowledge = [];
          stochastic.resolutionNote = 'Distinct matrix-invariant closure proof: row sums are preserved through the all-ones vector and entrywise nonnegativity is preserved under matrix multiplication.';

          fs.writeFileSync(greenPath, JSON.stringify(green, null, 2) + '\n');
          fs.writeFileSync(q150Path, JSON.stringify(q150, null, 2) + '\n');
          NODE
      - name: Verify semantic checkpoint
        run: node --test tests/quant-interview-vectors-linear-systems-workstream.test.mjs
      - name: Commit semantic decisions
        run: |
          git config user.name "Lorien"
          git config user.email "2249297094@qq.com"
          git add src/data/quant-interview/coverage/green-book.json src/data/quant-interview/coverage/150-most-frequently-asked.json
          git diff --cached --quiet && exit 0
          git commit -m "data: resolve vectors linear systems semantic identities"
          git push
