name: Quant Interview Expectation Coverage Mutator
on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-expectation-variance-covariance-2026-08-19
    paths:
      - scripts/mutate-expectation-coverage.mjs
permissions:
  contents: write
jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/quant-interview-workstream-expectation-variance-covariance-2026-08-19
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/mutate-expectation-coverage.mjs
      - name: Commit exact coverage mutation
        run: |
          if git diff --quiet; then
            echo "No mutation needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/quant-interview/topics/source-topic-map.json \
                  src/data/quant-interview/coverage/green-book.json \
                  src/data/quant-interview/coverage/red-book.json \
                  src/data/quant-interview/coverage/150-most-frequently-asked.json
          git commit -m "data: map expectation variance covariance source coverage"
          git push origin HEAD:chatgpt/quant-interview-workstream-expectation-variance-covariance-2026-08-19
