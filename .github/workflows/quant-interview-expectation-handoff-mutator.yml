name: Quant Interview Expectation Handoff Mutator
on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-expectation-variance-covariance-2026-08-19
    paths:
      - scripts/mutate-expectation-handoff.mjs
permissions:
  contents: write
jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/quant-interview-workstream-expectation-variance-covariance-2026-08-19
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/mutate-expectation-handoff.mjs
      - name: Commit exact handoff mutation
        run: |
          if git diff --quiet; then
            echo "No handoff mutation needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/quant-interview/HANDOFF.md
          git commit -m "docs: complete expectation variance covariance handoff"
          git push origin HEAD:chatgpt/quant-interview-workstream-expectation-variance-covariance-2026-08-19
