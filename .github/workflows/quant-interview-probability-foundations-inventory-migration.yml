name: Quant Interview Probability Foundations Inventory Migration

on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-probability-foundations-2026-08-17
    paths:
      - .github/workflows/quant-interview-probability-foundations-inventory-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add probability foundations item inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = {
            'green-book': [
              ('4.1', 'definitions-set-operations', None),
              ('4.1', 'coin-toss-game', None),
              ('4.1', 'card-game', None),
              ('4.1', 'drunk-passenger', None),
              ('4.1', 'n-points-on-a-circle', None),
            ],
            'red-book': [
              ('3.2.1', '3.16', None),
              ('3.2.1', '3.18', None),
              ('3.2.1', '3.24', None),
              ('3.2.1', '3.25', None),
            ],
            '150-most-frequently-asked': [
              ('1', '6', None),
              ('2.7', '3', 'Item-level mathematical identity is Probability Foundations even though the editorial source container is classified as brainteasers; item-level semantic ownership therefore overrides the coarse container mapping.'),
            ],
          }

          for source, specs in rows.items():
            p = Path(f'src/data/quant-interview/coverage/{source}.json')
            data = json.loads(p.read_text())
            existing = {(e['sourceSection'], e.get('sourceItem')) for e in data['entries']}
            for section, item, override in specs:
              key = (section, item)
              if key in existing:
                raise SystemExit(f'inventory row already exists: {source} {section}::{item}')
              entry = {
                'sourceSection': section,
                'sourceItem': item,
                'canonicalTopics': ['probability-foundations'],
                'state': 'needs-review',
                'canonicalProblems': [],
                'canonicalKnowledge': [],
              }
              if override:
                entry['topicOverrideReason'] = override
              data['entries'].append(entry)
              existing.add(key)
            p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Commit inventory
        run: |
          git config user.name "Lorien"
          git config user.email "2249297094@qq.com"
          git add src/data/quant-interview/coverage/green-book.json src/data/quant-interview/coverage/red-book.json src/data/quant-interview/coverage/150-most-frequently-asked.json
          git commit -m "chore: inventory probability foundations source items"
          git push
