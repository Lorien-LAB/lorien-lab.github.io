name: Quant Interview Determinants Inventory Migration

on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-determinants-eigenvalues-2026-08-16

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, 'run determinants inventory migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Upsert inspected determinant/eigenvalue inventory
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const specs = {
            'green-book': [
              ['3.6.3','determinant-properties'],
              ['3.6.3','eigenvalue-eigenvector-definitions'],
              ['3.6.3','trace-determinant-spectrum'],
              ['3.6.3','diagonalization'],
              ['3.6.3','two-by-two-eigensystem'],
            ],
            '150-most-frequently-asked': [
              ['2.2','4'],
              ['2.2','6'],
              ['2.2','7'],
              ['2.2','8'],
            ],
          };
          for (const [source, rows] of Object.entries(specs)) {
            const path = `src/data/quant-interview/coverage/${source}.json`;
            const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
            const keys = new Set(ledger.entries.map(e => `${e.sourceSection}::${e.sourceItem ?? ''}`));
            for (const [sourceSection, sourceItem] of rows) {
              const key = `${sourceSection}::${sourceItem}`;
              if (keys.has(key)) throw new Error(`inventory row already exists unexpectedly: ${source} ${key}`);
              ledger.entries.push({
                sourceSection,
                sourceItem,
                canonicalTopics: ['linear-algebra-matrix-methods','determinants-eigenvalues'],
                state: 'needs-review',
                canonicalProblems: [],
                canonicalKnowledge: []
              });
              keys.add(key);
            }
            fs.writeFileSync(path, JSON.stringify(ledger, null, 2) + '\n');
          }
          NODE
      - name: Commit inventory
        run: |
          git config user.name Lorien
          git config user.email 2249297094@qq.com
          git add src/data/quant-interview/coverage/green-book.json src/data/quant-interview/coverage/150-most-frequently-asked.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "data: inventory determinant eigenvalue source items [skip ci]"
          git push
