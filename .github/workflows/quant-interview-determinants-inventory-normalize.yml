name: Quant Interview Determinants Inventory Normalize

on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-determinants-eigenvalues-2026-08-16

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, 'run determinant inventory normalization')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Normalize item topics
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const keys = {
            'green-book': new Set(['3.6.3::determinant-properties','3.6.3::eigenvalue-eigenvector-definitions','3.6.3::trace-determinant-spectrum','3.6.3::diagonalization','3.6.3::two-by-two-eigensystem']),
            '150-most-frequently-asked': new Set(['2.2::4','2.2::6','2.2::7','2.2::8']),
          };
          for (const [source, wanted] of Object.entries(keys)) {
            const path = `src/data/quant-interview/coverage/${source}.json`;
            const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
            let seen = 0;
            for (const entry of ledger.entries) {
              const key = `${entry.sourceSection}::${entry.sourceItem ?? ''}`;
              if (!wanted.has(key)) continue;
              entry.canonicalTopics = ['determinants-eigenvalues'];
              delete entry.topicOverrideReason;
              seen += 1;
            }
            if (seen !== wanted.size) throw new Error(`${source}: normalized ${seen}/${wanted.size}`);
            fs.writeFileSync(path, JSON.stringify(ledger, null, 2) + '\n');
          }
          NODE
      - name: Commit normalization
        run: |
          git config user.name Lorien
          git config user.email 2249297094@qq.com
          git add src/data/quant-interview/coverage/green-book.json src/data/quant-interview/coverage/150-most-frequently-asked.json
          git diff --cached --check
          git commit -m "data: normalize determinant eigenvalue item topics [skip ci]"
          git push
