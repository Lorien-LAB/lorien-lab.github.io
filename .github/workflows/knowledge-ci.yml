name: Knowledge Base CI

on:
  push:
    branches: [knowledge-base-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Smoke tests
        run: npm test
      - name: Astro build
        run: npm run build
      - name: Install Chromium for visual QA
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture Knowledge Base QA screenshots
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/knowledge-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const desktop = await browser.newPage({ viewport: { width: 1536, height: 1024 }, deviceScaleFactor: 1 });
            await desktop.goto('http://127.0.0.1:4173/knowledge/', { waitUntil: 'networkidle' });
            await desktop.screenshot({ path: '/tmp/knowledge-desktop.png', fullPage: true });
            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await mobile.goto('http://127.0.0.1:4173/knowledge/', { waitUntil: 'networkidle' });
            await mobile.screenshot({ path: '/tmp/knowledge-mobile.png', fullPage: true });
            await browser.close();
          })();
          NODE
          mkdir -p qa
          base64 -w 0 /tmp/knowledge-desktop.png > qa/knowledge-desktop.png.b64
          base64 -w 0 /tmp/knowledge-mobile.png > qa/knowledge-mobile.png.b64
      - name: Save QA screenshots on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa/knowledge-desktop.png.b64 qa/knowledge-mobile.png.b64
          git diff --cached --quiet && exit 0
          git commit -m 'test: capture knowledge visual QA [skip ci]'
          git push origin HEAD:knowledge-base-v1
