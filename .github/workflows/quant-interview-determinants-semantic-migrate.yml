name: Quant Interview Determinants Semantic Migration

on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-determinants-eigenvalues-2026-08-16

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, 'run determinant semantic migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve determinant and eigenvalue semantic identities
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const decisions = {
            'green-book': {
              '3.6.3::determinant-properties': ['knowledge-only', [], ['matrix-spectral-invariants'], 'Determinant identities are reusable matrix facts rather than a distinct interview problem.'],
              '3.6.3::eigenvalue-eigenvector-definitions': ['knowledge-only', [], ['eigenvalues-eigenvectors'], 'Definitions, characteristic equations, multiplicities, and eigenspaces belong in canonical spectral Knowledge.'],
              '3.6.3::trace-determinant-spectrum': ['knowledge-only', [], ['eigenvalues-eigenvectors','matrix-spectral-invariants'], 'Trace and determinant as spectral invariants enrich the shared concept layer.'],
              '3.6.3::diagonalization': ['knowledge-only', [], ['eigenvalues-eigenvectors','eigenbasis-decomposition'], 'Diagonalization criteria and A^k in an eigenbasis are reusable concept/technique material.'],
              '3.6.3::two-by-two-eigensystem': ['canonical-problem', ['two-by-two-eigensystem'], ['eigenvalues-eigenvectors','matrix-spectral-invariants'], 'A concrete 2x2 eigensystem has an independent reasoning task and supports multiple interview-ready solution routes.'],
            },
            '150-most-frequently-asked': {
              '2.2::4': ['knowledge-only', [], ['eigenvalues-eigenvectors'], 'The eigenvalue/eigenvector count question is best preserved as an Interview Check on multiplicity, eigenspaces, and defective matrices.'],
              '2.2::6': ['canonical-problem', ['apply-matrix-via-eigenbasis'], ['eigenvalues-eigenvectors','eigenbasis-decomposition'], 'Applying A to a vector from known eigenpairs is a distinct eigenbasis-decomposition reasoning problem.'],
              '2.2::7': ['canonical-problem', ['trace-ab-equals-trace-ba'], ['matrix-spectral-invariants'], 'Trace cyclicity is a distinct proof task with direct index and stronger spectral interpretations.'],
              '2.2::8': ['canonical-problem', ['commutator-cannot-equal-identity'], ['matrix-spectral-invariants'], 'The commutator obstruction is a distinct invariant-recognition problem using trace.'],
            },
          };
          for (const [source, byKey] of Object.entries(decisions)) {
            const path = `src/data/quant-interview/coverage/${source}.json`;
            const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
            const entries = new Map(ledger.entries.map(e => [`${e.sourceSection}::${e.sourceItem ?? ''}`, e]));
            for (const [key, [state, canonicalProblems, canonicalKnowledge, resolutionNote]] of Object.entries(byKey)) {
              const entry = entries.get(key);
              if (!entry) throw new Error(`missing inventory row: ${source} ${key}`);
              entry.state = state;
              entry.canonicalProblems = canonicalProblems;
              entry.canonicalKnowledge = canonicalKnowledge;
              entry.resolutionNote = resolutionNote;
            }
            fs.writeFileSync(path, JSON.stringify(ledger, null, 2) + '\n');
          }
          NODE
      - name: Commit semantic decisions
        run: |
          git config user.name Lorien
          git config user.email 2249297094@qq.com
          git add src/data/quant-interview/coverage/green-book.json src/data/quant-interview/coverage/150-most-frequently-asked.json
          git diff --cached --check
          git commit -m "data: resolve determinant eigenvalue semantic identities [skip ci]"
          git push
