name: Quant Interview Probability Foundations Semantic Migration

on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-probability-foundations-2026-08-17
    paths:
      - .github/workflows/quant-interview-probability-foundations-semantic-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Terminalize probability foundations semantic rows
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          decisions = {
            'green-book': {
              ('4.1', 'definitions-set-operations'): (
                'knowledge-only', [], ['probability-spaces-events'],
                'Source-derived outcome, sample-space, event, union/intersection/complement, mutually-exclusive, and indicator language is preserved in probability-spaces-events and its Interview Checks.'
              ),
              ('4.1', 'coin-toss-game'): (
                'canonical-problem', ['more-heads-with-one-extra-coin'], ['symmetry-equiprobability-geometric-probability'],
                'Primary source instance of the extra-coin symmetry family; equal-n tie decomposition resolves to the source-neutral more-heads-with-one-extra-coin Problem.'
              ),
              ('4.1', 'card-game'): (
                'canonical-problem', ['higher-card-by-symmetry'], ['symmetry-equiprobability-geometric-probability'],
                'Primary source instance of the tie-aware rank-symmetry family; tie mass is removed before symmetry in higher-card-by-symmetry.'
              ),
              ('4.1', 'drunk-passenger'): (
                'canonical-problem', ['drunk-passenger-last-seat'], ['symmetry-equiprobability-geometric-probability'],
                'Primary source instance of the displaced-passenger symmetry family; the two-special-seat state reduction resolves to drunk-passenger-last-seat.'
              ),
              ('4.1', 'n-points-on-a-circle'): (
                'canonical-problem', ['random-points-in-a-semicircle'], ['probability-spaces-events', 'symmetry-equiprobability-geometric-probability'],
                'Distinct semicircle covering Problem using event partitioning plus geometric symmetry; public targets are random-points-in-a-semicircle and its supporting event/symmetry Knowledge.'
              ),
            },
            'red-book': {
              ('3.2.1', '3.16'): (
                'knowledge-only', [], ['symmetry-equiprobability-geometric-probability'],
                'Knowledge-only equiprobable weekday-modeling self-test retained in symmetry-equiprobability-geometric-probability; it does not warrant a separate S3+ Problem.'
              ),
              ('3.2.1', '3.18'): (
                'merged-duplicate', ['higher-card-by-symmetry'], ['symmetry-equiprobability-geometric-probability'],
                'Merged duplicate of higher-card-by-symmetry; it contributes the same tie/non-tie partition and symmetry route.'
              ),
              ('3.2.1', '3.24'): (
                'canonical-problem', ['romeo-juliet-meeting-probability'], ['symmetry-equiprobability-geometric-probability'],
                'Distinct continuous geometric-probability task represented by romeo-juliet-meeting-probability and unit-square modeling Knowledge.'
              ),
              ('3.2.1', '3.25'): (
                'merged-duplicate', ['drunk-passenger-last-seat'], ['symmetry-equiprobability-geometric-probability'],
                'Merged duplicate of drunk-passenger-last-seat; wording differs but the displacement process and two-special-seat reasoning identity are the same.'
              ),
            },
            '150-most-frequently-asked': {
              ('1', '6'): (
                'canonical-problem', ['minimum-trials-for-at-least-one-hit'], ['probability-axioms-derived-rules'],
                'This source item contributes complement-event and repeated-independence reasoning to the mixed canonical Knowledge node; it does not source or support the repository-authored Kolmogorov-axiom extension.'
              ),
              ('2.7', '3'): (
                'merged-duplicate', ['more-heads-with-one-extra-coin'], ['symmetry-equiprobability-geometric-probability'],
                'Merged duplicate of more-heads-with-one-extra-coin; it contributes an alternative symmetry derivation while retaining the same canonical reasoning identity.'
              ),
            },
          }

          for source, source_decisions in decisions.items():
            p = Path(f'src/data/quant-interview/coverage/{source}.json')
            data = json.loads(p.read_text())
            by_key = {(entry['sourceSection'], entry.get('sourceItem')): entry for entry in data['entries']}
            for key, (state, problems, knowledge, note) in source_decisions.items():
              if key not in by_key:
                raise SystemExit(f'missing coverage row: {source} {key}')
              entry = by_key[key]
              if entry.get('state') != 'needs-review':
                raise SystemExit(f'expected needs-review before terminalization: {source} {key} got {entry.get("state")}')
              entry['state'] = state
              entry['canonicalProblems'] = problems
              entry['canonicalKnowledge'] = knowledge
              entry['resolutionNote'] = note
            p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Verify semantic rows
        run: |
          node --test tests/quant-interview-probability-foundations-workstream.test.mjs
      - name: Commit semantic closure
        run: |
          git config user.name "Lorien"
          git config user.email "2249297094@qq.com"
          git add src/data/quant-interview/coverage/green-book.json src/data/quant-interview/coverage/red-book.json src/data/quant-interview/coverage/150-most-frequently-asked.json
          git commit -m "data: close probability foundations semantic mappings"
          git push
