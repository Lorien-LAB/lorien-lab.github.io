name: Quant Interview Vectors Test Contract Fix

on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-vectors-linear-systems-2026-08-17
    paths:
      - .github/workflows/quant-interview-vectors-test-contract-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Update stale assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/quant-interview-cross-book-workstream.test.mjs')
          s = p.read_text()
          old = "'3.6.1::correlation-range-0.8-0.8': ['variant', ['correlation-matrix-parameter-range'], ['correlation-matrix', 'positive-semidefinite-matrix', 'principal-minor-feasibility']],"
          new = "'3.6.1::correlation-range-0.8-0.8': ['variant', ['correlation-matrix-parameter-range'], ['correlation-matrix', 'positive-semidefinite-matrix', 'principal-minor-feasibility', 'vector-geometry-inner-products']],"
          if old not in s:
              raise SystemExit('legacy semantic assertion not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/quant-interview-vectors-linear-systems-content.test.mjs')
          s = p.read_text()
          old = r"assert.match(text, /one-dimensional null space|dim\s*N\(A\)\s*=\s*1/i);"
          new = r"assert.match(text, /one-dimensional null space|dim\s*N\(A\)[^\n]*=\s*1/i);"
          if old not in s:
              raise SystemExit('rank-nullity assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Verify corrected contracts
        run: |
          npm ci
          node --test tests/quant-interview-cross-book-workstream.test.mjs tests/quant-interview-vectors-linear-systems-content.test.mjs
          npm run test
      - name: Commit fixes
        run: |
          git config user.name "Lorien"
          git config user.email "2249297094@qq.com"
          git add tests/quant-interview-cross-book-workstream.test.mjs tests/quant-interview-vectors-linear-systems-content.test.mjs
          git commit -m "test: align vectors provenance and rank assertions"
          git push
