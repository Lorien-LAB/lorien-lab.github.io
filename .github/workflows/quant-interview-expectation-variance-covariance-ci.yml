name: Quant Interview Expectation Variance Covariance CI
on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-expectation-variance-covariance-2026-08-19
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify and record exact commit evidence
        shell: bash
        run: |
          set +e
          npm run test > /tmp/expectation-test.log 2>&1
          TEST_STATUS=$?
          npm run check > /tmp/expectation-check.log 2>&1
          CHECK_STATUS=$?
          npm run build > /tmp/expectation-build.log 2>&1
          BUILD_STATUS=$?
          set -e

          if [ "$TEST_STATUS" -eq 0 ] && [ "$CHECK_STATUS" -eq 0 ] && [ "$BUILD_STATUS" -eq 0 ]; then
            CONCLUSION=success
          else
            CONCLUSION=failure
          fi

          export VERIFIED_COMMIT='${{ github.sha }}'
          export RUN_ID='${{ github.run_id }}'
          export CONCLUSION TEST_STATUS CHECK_STATUS BUILD_STATUS
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const tail = (file) => readFileSync(file, 'utf8').split('\n').slice(-120).join('\n');
          const evidence = {
            verifiedCommit: process.env.VERIFIED_COMMIT,
            runId: Number(process.env.RUN_ID),
            conclusion: process.env.CONCLUSION,
            commands: ['npm run test', 'npm run check', 'npm run build'],
            statuses: {
              test: Number(process.env.TEST_STATUS),
              check: Number(process.env.CHECK_STATUS),
              build: Number(process.env.BUILD_STATUS),
            },
            logTails: {
              test: tail('/tmp/expectation-test.log'),
              check: tail('/tmp/expectation-check.log'),
              build: tail('/tmp/expectation-build.log'),
            },
          };
          writeFileSync('.github/quant-interview-expectation-ci-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/quant-interview-expectation-ci-evidence.json
          git commit -m "ci: record expectation verification run ${{ github.run_id }}"
          git push origin HEAD:chatgpt/quant-interview-workstream-expectation-variance-covariance-2026-08-19

          if [ "$CONCLUSION" != success ]; then
            echo "Verification failed; see committed evidence log tails."
            exit 1
          fi
