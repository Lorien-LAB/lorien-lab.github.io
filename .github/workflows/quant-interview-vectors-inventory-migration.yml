name: Quant Interview Vectors Inventory Migration

on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-vectors-linear-systems-2026-08-17
    paths:
      - .github/workflows/quant-interview-vectors-inventory-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Patch hidden coverage inventory
        run: |
          node <<'NODE'
          const fs = require('fs');
          const greenPath = 'src/data/quant-interview/coverage/green-book.json';
          const q150Path = 'src/data/quant-interview/coverage/150-most-frequently-asked.json';
          const green = JSON.parse(fs.readFileSync(greenPath, 'utf8'));
          const q150 = JSON.parse(fs.readFileSync(q150Path, 'utf8'));

          const key = (e) => `${e.sourceSection}::${e.sourceItem ?? ''}`;
          const greenNewItems = [
            'vector-coordinate-representation',
            'dot-product',
            'euclidean-norm-distance',
            'angle-orthogonality',
            'correlation-as-cosine',
          ];
          const greenKeys = new Set(green.entries.map(key));
          for (const sourceItem of greenNewItems) {
            const k = `3.6.1::${sourceItem}`;
            if (!greenKeys.has(k)) {
              green.entries.push({
                sourceSection: '3.6.1',
                sourceItem,
                canonicalTopics: ['vectors-linear-systems'],
                state: 'needs-review',
                canonicalProblems: [],
                canonicalKnowledge: [],
              });
              greenKeys.add(k);
            }
          }

          const correlationRows = green.entries.filter((e) => e.sourceItem === 'correlation-range-0.8-0.8');
          if (correlationRows.length !== 1) throw new Error(`Expected exactly one correlation-range row, found ${correlationRows.length}`);
          const correlation = correlationRows[0];
          correlation.sourceSection = '3.6.1';
          if (!correlation.canonicalTopics.includes('vectors-linear-systems')) correlation.canonicalTopics.unshift('vectors-linear-systems');
          correlation.topicOverrideReason = 'The source item physically appears in the Vectors section 3.6.1, while its semantic destination also crosses into correlation/PSD topics already owned by the canonical correlation-matrix workstream.';

          const q150Keys = new Set(q150.entries.map(key));
          if (!q150Keys.has('2.2::9')) {
            q150.entries.push({
              sourceSection: '2.2',
              sourceItem: '9',
              canonicalTopics: ['vectors-linear-systems'],
              state: 'needs-review',
              canonicalProblems: [],
              canonicalKnowledge: [],
            });
          }

          fs.writeFileSync(greenPath, JSON.stringify(green, null, 2) + '\n');
          fs.writeFileSync(q150Path, JSON.stringify(q150, null, 2) + '\n');
          NODE
      - name: Commit migration
        run: |
          git config user.name "Lorien"
          git config user.email "2249297094@qq.com"
          git add src/data/quant-interview/coverage/green-book.json src/data/quant-interview/coverage/150-most-frequently-asked.json
          git diff --cached --quiet && exit 0
          git commit -m "data: inventory vectors linear systems source items"
          git push
