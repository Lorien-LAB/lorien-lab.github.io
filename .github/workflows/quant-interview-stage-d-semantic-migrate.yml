name: Quant Interview Stage D Semantic Migration

on:
  push:
    branches:
      - chatgpt/quant-interview-topic-first-stage-d-covariance-psd-2026-08-16

permissions:
  contents: write

jobs:
  migrate:
    if: contains(github.event.head_commit.message, 'run Stage D semantic migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Resolve semantic identities
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const decisions = {
            'green-book': {
              '3.6.4::psd-pd-criteria': ['knowledge-only', [], ['positive-semidefinite-matrix','principal-minor-feasibility'], 'The source section mixes a correct PSD quadratic-form definition with an overbroad leading-principal-minor statement. Canonical Knowledge distinguishes PSD from the positive-definite Sylvester criterion.'],
              '3.6.4::correlation-range-0.8-0.8': ['variant', ['correlation-matrix-parameter-range'], ['correlation-matrix','positive-semidefinite-matrix','principal-minor-feasibility'], 'Same matrix-feasibility structure as the canonical parameter-range problem, with different fixed correlations and a different admissible interval.'],
              '4.5::covariance-correlation-definitions': ['knowledge-only', [], ['correlation-matrix'], 'Definitions and normalization identities enrich canonical covariance/correlation Knowledge rather than forming a standalone problem.'],
            },
            'red-book': {
              '3.2.1::3.26': ['variant', ['correlation-matrix-parameter-range'], ['correlation-matrix','positive-semidefinite-matrix','principal-minor-feasibility'], 'Same joint-correlation feasibility family, posed as validity of a fully specified triple and naturally generalizable to an admissible interval.'],
              '3.2.1::3.35': ['canonical-problem', ['covariance-matrix-positive-semidefinite-proof'], ['correlation-matrix','positive-semidefinite-matrix'], 'The question says positive definite, while its solution correctly observes covariance matrices are only guaranteed positive semidefinite. Canonical wording uses the correct PSD claim.'],
              '6.2.1::6.9': ['knowledge-only', [], ['positive-semidefinite-matrix','principal-minor-feasibility'], 'Definition/properties material enriches canonical PSD/PD Knowledge and interview checks.'],
            },
            '150-most-frequently-asked': {
              '1::5': ['canonical-problem', ['correlation-matrix-parameter-range'], ['correlation-matrix','positive-semidefinite-matrix','principal-minor-feasibility'], 'Existing canonical parameter-range problem.'],
              '2.2::1': ['variant', ['covariance-matrix-positive-semidefinite-proof'], ['correlation-matrix','positive-semidefinite-matrix'], 'Same covariance-PSD proof identity, extended to show the correlation matrix is PSD as well.'],
              '2.2::2': ['canonical-problem', ['covariance-to-correlation-matrix'], ['correlation-matrix'], 'Distinct normalization/congruence-transform problem.'],
              '2.2::3': ['canonical-problem', ['equicorrelation-matrix-bounds'], ['correlation-matrix','positive-semidefinite-matrix'], 'Distinct n-dimensional equicorrelation eigenvalue/bound problem.'],
              '2.2::10': ['merged-duplicate', ['correlation-matrix-parameter-range'], ['correlation-matrix','positive-semidefinite-matrix','principal-minor-feasibility'], 'Repeats the First Look parameter matrix; its additional Schur/completing-square methods enrich the existing canonical problem rather than creating another page.'],
            },
          };
          for (const [source, byKey] of Object.entries(decisions)) {
            const path = `src/data/quant-interview/coverage/${source}.json`;
            const ledger = JSON.parse(fs.readFileSync(path, 'utf8'));
            const entries = new Map(ledger.entries.map(e => [`${e.sourceSection}::${e.sourceItem ?? ''}`, e]));
            for (const [key, [state, canonicalProblems, canonicalKnowledge, resolutionNote]] of Object.entries(byKey)) {
              const entry = entries.get(key);
              if (!entry) throw new Error(`missing inventory row: ${source} ${key}`);
              entry.state = state;
              entry.canonicalProblems = canonicalProblems;
              entry.canonicalKnowledge = canonicalKnowledge;
              entry.resolutionNote = resolutionNote;
            }
            fs.writeFileSync(path, JSON.stringify(ledger, null, 2) + '\n');
          }
          NODE
      - name: Commit semantic decisions
        run: |
          git config user.name Lorien
          git config user.email 2249297094@qq.com
          git add src/data/quant-interview/coverage
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "data: reconcile first cross-book covariance PSD identities [skip ci]"
          git push
