name: Apply Combinatorial Probability Coverage

on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-combinatorial-probability-2026-08-17

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/apply-combinatorial-probability-coverage.mjs
      - run: npm run test
      - run: npm run check
      - run: npm run build
      - name: Commit reconciled coverage
        shell: bash
        run: |
          if git diff --quiet -- src/data/quant-interview/coverage; then
            echo "Coverage already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/quant-interview/coverage/green-book.json \
                  src/data/quant-interview/coverage/red-book.json \
                  src/data/quant-interview/coverage/150-most-frequently-asked.json
          git commit -m "data: reconcile combinatorial probability coverage"
          git push origin "HEAD:${GITHUB_REF_NAME}"
