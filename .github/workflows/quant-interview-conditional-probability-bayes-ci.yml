name: Quant Interview Conditional Probability Bayes CI

on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-conditional-probability-bayes-2026-08-17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run check
      - run: npm run build
