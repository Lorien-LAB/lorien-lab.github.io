name: Learning Resources Gateway CI

on:
  push:
    branches: [knowledge-learning-resources-gateway-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Smoke tests
        run: npm test
      - name: Astro check
        run: npm run check
      - name: Astro build
        run: npm run build
