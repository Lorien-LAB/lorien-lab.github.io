name: Quant Interview Expectation Graph Mutator
on:
  push:
    branches:
      - chatgpt/quant-interview-workstream-expectation-variance-covariance-2026-08-19
    paths:
      - scripts/mutate-expectation-graph.mjs
permissions:
  contents: write
jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/quant-interview-workstream-expectation-variance-covariance-2026-08-19
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/mutate-expectation-graph.mjs
      - name: Commit exact graph mutation
        run: |
          if git diff --quiet; then
            echo "No graph mutation needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/knowledge/concepts/common-probability-distributions.md \
                  src/content/knowledge/concepts/gaussian-lognormal-structure.md \
                  src/content/knowledge/concepts/random-variable-transformations-convolution.md \
                  src/content/knowledge/concepts/first-step-analysis.md
          git commit -m "feat: link expectation variance covariance knowledge"
          git push origin HEAD:chatgpt/quant-interview-workstream-expectation-variance-covariance-2026-08-19
